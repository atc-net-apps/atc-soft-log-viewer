name: "Build and test"

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet-build:
    runs-on: windows-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 🔁 Restore packages
        run: dotnet restore AtcSoft.Log.Viewer.slnx

      - name: 🛠️ Build solution
        run: dotnet build AtcSoft.Log.Viewer.slnx -c Release --no-restore

  dotnet-test:
    runs-on: windows-latest
    needs: dotnet-build
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 🔁 Restore packages
        run: dotnet restore AtcSoft.Log.Viewer.slnx

      - name: 🛠️ Build solution
        run: dotnet build AtcSoft.Log.Viewer.slnx -c Release --no-restore /p:UseSourceLink=true

      - name: 🧪 Run unit tests with code coverage
        run: dotnet test --solution AtcSoft.Log.Viewer.slnx -c Release --no-build --coverage --coverage-output-format cobertura

      - name: 📤 Upload coverage reports as workflow artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cobertura
          path: '**/TestResults/**/*.cobertura.xml'
          if-no-files-found: warn
          retention-days: 14

  # The same steps as the release, so a broken installer is found in the pull request, not by the release
  installer:
    runs-on: windows-latest
    needs: dotnet-build
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Publish the app
        run: dotnet publish src/AtcSoft.Log.Viewer.Wpf.App/AtcSoft.Log.Viewer.Wpf.App.csproj --configuration Release --output ./publish

      - name: 🛠️ Build the installer
        run: dotnet build setup/AtcSoft.Log.Viewer.Installer/AtcSoft.Log.Viewer.Installer.wixproj --configuration Release -p:PublishDir=${{ github.workspace }}/publish

      - name: ⬆️ Upload the MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-installer
          path: setup/AtcSoft.Log.Viewer.Installer/bin/Release/*.msi
          retention-days: 5
