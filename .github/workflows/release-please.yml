name: release-please

on:
  push:
    branches:
      - main

# Each job asks for what it needs
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Write access for the GITHUB_TOKEN fallback: it opens the release pull request and creates the release
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: 🚀 release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT is used rather than GITHUB_TOKEN so the release pull request
          # triggers build.yml: events raised by GITHUB_TOKEN don't trigger workflows.
          # The fallback keeps releases working if the secret is missing.
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}

  build-installer:
    name: Build MSI
    # WPF and WiX need a Windows runner.
    runs-on: windows-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Publish the app
        run: dotnet publish src/AtcSoft.Log.Viewer.Wpf.App/AtcSoft.Log.Viewer.Wpf.App.csproj --configuration ${{ env.CONFIGURATION }} --output ./publish

      # No -p:ProductVersion here: it comes from setup/Directory.Build.props.
      - name: 🛠️ Build the installer
        run: dotnet build setup/AtcSoft.Log.Viewer.Installer/AtcSoft.Log.Viewer.Installer.wixproj --configuration ${{ env.CONFIGURATION }} -p:PublishDir=${{ github.workspace }}/publish

      - name: ⬆️ Upload the MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-installer
          path: setup/AtcSoft.Log.Viewer.Installer/bin/${{ env.CONFIGURATION }}/*.msi
          retention-days: 5

  upload-assets:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: [release-please, build-installer]
    if: needs.release-please.outputs.release_created == 'true'
    # Attaches files to the release
    permissions:
      contents: write

    steps:
      - name: ⬇️ Download the MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-installer
          path: ./msi

      # One checksum file per MSI, so a download can be checked: AtcSoft.Log.Viewer.Installer.msi.sha256
      - name: 🔒 Write the SHA-256 checksums
        working-directory: ./msi
        run: for f in *.msi; do sha256sum "$f" > "$f.sha256"; done

      # The update check looks for this asset by name: AtcSoft.Log.Viewer.Installer.msi.
      - name: 📎 Attach the MSI and its checksum to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ./msi/*.msi ./msi/*.msi.sha256 --clobber --repo "${{ github.repository }}"
