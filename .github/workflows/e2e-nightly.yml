name: "UI tests (nightly)"

# The UI tests open real windows, so the normal build skips them. This runs them every night
# on a Windows runner, and on demand.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 🛠️ Build solution
        run: dotnet build AtcSoft.Log.Viewer.slnx -c Release

      # The tests write their folders below %TEMP%\AtcSoft.Log.Viewer.E2E; TEMP is pointed at the
      # runner's temp folder so they can be uploaded when a test fails.
      - name: 🖥️ Run the UI tests
        env:
          ATCSOFT_E2E: '1'
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: dotnet test --project test/AtcSoft.Log.Viewer.E2E.Tests -c Release --no-build

      - name: 📤 Upload the test run folders
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-run
          path: ${{ runner.temp }}/AtcSoft.Log.Viewer.E2E
          if-no-files-found: warn
          retention-days: 14
